name: CI

on:
  pull_request:
  push:
    branches: [cpp]

jobs:
  test-cpp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36

      - name: Build Project
        run: cmake -B build -DBUILD_SHARED_LIBS=ON -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON && cmake --build build

      - name: Run Unit Tests
        run: ctest --test-dir build 

      - name: Run Examples
        run: |
          ./build/startorch_test
          ./build/startorch_example
